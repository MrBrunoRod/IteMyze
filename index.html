<!doctype html>
<html lang="en">

<!-- We kept the index.html file outside of the HTML file because we want to use GitHub to host 
  the website and keeping the file in the root is a necessary step-->

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./CSS/indexPage.css" />
  <title>Sign In</title>
</head>

<body>
  <main id="login-area">

    <section id="image-area" aria-label="Game gallery">
      <div class="image-track">
        <div class="image-set">
          <img src="./Images/boardGames.jpg" alt="Various board games" />
          <img src="./Images/cardGames.jpg" alt="Various card games" />
          <img src="./Images/videoGames.jpg" alt="Various video games" />
        </div>

        <div class="image-set" aria-hidden="true">
          <img src="./Images/boardGames.jpg" alt="" />
          <img src="./Images/cardGames.jpg" alt="" />
          <img src="./Images/videoGames.jpg" alt="" />
        </div>
      </div>
    </section>

    <form id="login-form" action="HTML/homePage.html" method="GET">

      <fieldset class="user-info">
        <legend>Sign in to your account</legend>

        <div>
          <label for="user-name">User Name</label>
          <input name="userName" id="user-name" type="text" autocomplete="username"/>
        </div>

        <div>
          <label for="user-password">Password</label>
          <input name="userPassword" id="user-password" type="password" autocomplete="current-password"/>
        </div>
      </fieldset>

      <div id="signin-button">
        <input type="submit" value="Sign In" />
      </div>

    </form>
  </main>

  <script>
    const imageTrack = document.querySelector(".image-track");
    const imageSet = document.querySelector(".image-set");

    function updateScrollDistance() {
      const distance = imageSet.offsetHeight;

      imageTrack.style.setProperty(
        "--scroll-distance",
        `${distance}px`
      );
    }

    window.addEventListener("load", updateScrollDistance);
    window.addEventListener("resize", updateScrollDistance);
  </script>
</body>
</html>
