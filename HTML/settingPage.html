<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/styles.css" />
    <title>IteMyze | Settings</title>
    <script src="../JavaScript/theme.js" defer></script>
    <script src="../JavaScript/settingPage.js" defer></script>
  </head>
  <body>
    <header>
      <h1>IteMyze</h1>
    </header>

    <nav aria-label="Main">
      <a href="homePage.html">Home</a>
      <a href="myGames.html">My Games</a>
      <a href="profilePage.html">Profile</a>
      <a href="settingPage.html" aria-current="page">Settings</a>
      <a href="../index.html">Log Out</a>
    </nav>

    <main>
      <div class="container">
        <div class="row">
          <section id="settings-section" class="col-12 col-md-6">
            <h2>Settings</h2>
            <form>
              <label for="user-name">Display name</label>
              <input type="text" id="user-name" name="user-name" placeholder="Leave blank to use your login name"/>

              <label for="theme">Theme</label>
              <select id="theme" name="theme">
                <option>Light</option>
                <option>Dark</option>
              </select>

              <button type="submit">Save</button>

              <p id="setting-message" aria-live="polite"></p>
            </form>
          </section>
        </div>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 IteMyze</p>
    </footer>
  </body>
</html>
