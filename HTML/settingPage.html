<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./CSS/settingPage.css" />
    <title>IteMyze | Settings</title>
  </head>
  <body>
    <header>
      <h1>IteMyze</h1>
    </header>

    <nav aria-label="Main">
      <a href="/HTML/homePage.html">Home</a>
      <a href="addGames.html">Add Games</a>
      <a href="/HTML/profilePage.html">Profile</a>
      <a href="/HTML/settingPage.html" aria-current="page">Settings</a>
      <a href="../index.html">Log Out</a>
    </nav>

    <main>
      <div class="container">
        <div class="row">
          <section id="settings-section" class="col-12 col-md-6">
            <h2>Settings</h2>
            <form>
              <label for="User-name">Username</label>
              <input type="text" id="user-name" name="user-name" />

              <label for="email">Email</label>
              <input type="email" id="email" name="email" />

              <label for="theme">Theme</label>
              <select id="theme" name="theme">
                <option>Light</option>
                <option>Dark</option>
              </select>

              <button type="submit">Save</button>
            </form>
          </section>
        </div>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 IteMyze</p>
    </footer>
  </body>
</html>
