<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/styles.css" />
    <title>IteMyze | Home</title>
    <script src="../JavaScript/theme.js" defer></script>
    <script src="../JavaScript/game.js" defer></script>    
    <script src="../JavaScript/homePage.js" defer></script>
  </head>
  <body>
    <header>
      <h1>IteMyze</h1>
    </header>

    <nav aria-label="Main">
      <a href="homePage.html" aria-current="page">Home</a>
      <a href="myGames.html">My Games</a>
      <a href="profilePage.html">Profile</a>
      <a href="settingPage.html">Settings</a>
      <a href="../index.html">Log Out</a>
    </nav>

    <main>
      <div class="container">
        <section id="search-section" aria-label="Search and filter games">
          <form id="filter-form" role="search">
            <div class="search-row">
              <label for="game-search" class="visually-hidden">Search games by name</label>
              <input type="search" id="game-search" placeholder="Search games..."/>

              <button type="button" id="filter-toggle" aria-expanded="false" aria-controls="filter-panel">
                Filters ▾
              </button>

              <button type="submit">Apply</button>
            </div>

            <div id="filter-panel" hidden>
              <div class="filter-option">
                <label for="genre-filter">Genre</label>
                <select id="genre-filter">
                  <option value="all">All genres</option>
                </select>
              </div>

              <div class="filter-option">
                <label for="year-filter">Released: <span id="year-value"></span></label>
                <input type="range" id="year-filter"/>
              </div>

              <div class="filter-option">
                <label for="developer-search">Developer</label>
                <input type="text" id="developer-search" placeholder="e.g. Riot Games" />
              </div>
            </div>
          </form>
        </section>

        <section id="results-section">
          <h2>Browse Games</h2>
          <p id="results-message" aria-live="polite"></p>
          <div id="game-results" class="game-grid"></div>
          <button type="button" id="show-more" hidden>Show more</button>
        </section>

      </div>
    </main>

    <footer>
      <p>&copy; 2026 IteMyze</p>
      <p>Game data provided by <a href="https://www.freetogame.com" target="_blank" rel="noopener">FreeToGame</a></p>
    </footer>
  </body>
</html>
